name: publish

# A published GitHub release goes to PyPI; running this workflow by hand
# (Actions > publish > Run workflow) goes to TestPyPI, as a rehearsal.
# Both use trusted publishing: no token is stored anywhere.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test
        run: |
          pip install -e '.[dev]'
          flake8 pygeoapi_yaml tests
          pytest
      - name: Check that the release tag matches the version
        if: github.event_name == 'release'
        run: |
          version=$(python -c 'import pygeoapi_yaml; print(pygeoapi_yaml.__version__)')
          echo "version $version, tag $TAG"
          test "v$version" = "$TAG"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pygeoapi-yaml
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pygeoapi-yaml
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
