server:
  bind:
    host: 0.0.0.0
    port: 5000
  url: http://localhost:5000/
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  languages:
    - en-US
  limits:
    default_items: 10
    max_items: 50
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; OpenStreetMap contributors'

logging:
  level: ERROR

metadata:
  identification:
    title: pygeoapi-yaml tests
    description: Test configuration for pygeoapi-yaml
    keywords:
      - yaml
    keywords_type: theme
    terms_of_service: https://creativecommons.org/licenses/by/4.0/
    url: https://example.org
  license:
    name: CC-BY 4.0 license
    url: https://creativecommons.org/licenses/by/4.0/
  provider:
    name: pygeoapi-yaml
    url: https://example.org
  contact:
    name: Tests
    position: Tests
    address: Nowhere
    city: Nowhere
    stateorprovince: Nowhere
    postalcode: '0'
    country: Nowhere
    phone: '0'
    email: tests@example.org
    url: https://example.org
    hours: Always
    instructions: None
    role: pointOfContact

resources:
  observations:
    type: collection
    title: Observations
    description: Observations read from a YAML file
    keywords:
      - observations
    extents:
      spatial:
        bbox: [-180, -90, 180, 90]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
      temporal:
        begin: 2026-01-01T00:00:00Z
        end: null
    providers:
      - type: feature
        name: pygeoapi_yaml.provider.YAMLProvider
        data: tests/data/observations.yaml
        id_field: id
        title_field: name
        time_field: seen
        geometry:
          x_field: lon
          y_field: lat

  empty:
    type: collection
    title: Empty
    description: A YAML file without items yet
    keywords:
      - empty
    extents:
      spatial:
        bbox: [-180, -90, 180, 90]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: feature
        name: pygeoapi_yaml.provider.YAMLProvider
        data: tests/data/empty.yaml
        id_field: id

  notes:
    type: collection
    title: Notes
    description: A directory of YAML files, one per page
    keywords:
      - notes
    extents:
      spatial:
        bbox: [-180, -90, 180, 90]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: feature
        name: pygeoapi_yaml.provider.YAMLProvider
        data: tests/data/notes
        items_key: notes
        exclude:
          - template.yaml
        id_field: id
        title_field: text
